<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="ui-monospace,monospace" font-size="13">
  <title>Three deployment modes of SnoopWPF.Agent</title>
  <desc>Architecture diagram showing the three deployment modes of SnoopWPF.Agent: NuGet co-located (MCP server embedded in WPF app process), external injection via snoop-mcp.exe, and brokered pipe with HMAC-SHA256 handshake. All modes expose the same 33 wpf_* MCP tools surface.</desc>

  <!-- Background -->
  <rect width="760" height="220" fill="#0f0f13" rx="10"/>

  <!-- AI Client box -->
  <rect x="20" y="70" width="140" height="80" rx="8" fill="#1e2536" stroke="#5b7ed8" stroke-width="1.5"/>
  <text x="90" y="107" text-anchor="middle" fill="#edf1f7" font-weight="bold">AI Client</text>
  <text x="90" y="124" text-anchor="middle" fill="#5b7ed8" font-size="11">Claude Code</text>
  <text x="90" y="138" text-anchor="middle" fill="#5b7ed8" font-size="11">Cursor / Desktop</text>

  <!-- Mode 1: NuGet co-located -->
  <rect x="210" y="20" width="160" height="55" rx="8" fill="#1a2e2c" stroke="#4ab9c9" stroke-width="1.5"/>
  <text x="290" y="44" text-anchor="middle" fill="#d8f0f3" font-weight="bold" font-size="12">NuGet co-located</text>
  <text x="290" y="60" text-anchor="middle" fill="#4ab9c9" font-size="10">WPF App + MCP server</text>
  <text x="290" y="73" text-anchor="middle" fill="#4ab9c9" font-size="10">same process (stdio)</text>

  <!-- Mode 2: External injection -->
  <rect x="210" y="95" width="160" height="55" rx="8" fill="#2a2415" stroke="#e8c76f" stroke-width="1.5"/>
  <text x="290" y="119" text-anchor="middle" fill="#f5eedb" font-weight="bold" font-size="12">External injection</text>
  <text x="290" y="135" text-anchor="middle" fill="#e8c76f" font-size="10">snoop-mcp.exe --pid N</text>
  <text x="290" y="148" text-anchor="middle" fill="#e8c76f" font-size="10">hostfxr bootstrap DLL</text>

  <!-- Mode 3: Brokered -->
  <rect x="210" y="165" width="160" height="48" rx="8" fill="#251a28" stroke="#b87fcc" stroke-width="1.5"/>
  <text x="290" y="187" text-anchor="middle" fill="#f0dff5" font-weight="bold" font-size="12">Brokered pipe</text>
  <text x="290" y="203" text-anchor="middle" fill="#b87fcc" font-size="10">BrokerHost + target pipe</text>

  <!-- WPF Target boxes -->
  <rect x="430" y="90" width="150" height="45" rx="8" fill="#1a1e2e" stroke="#6b7380" stroke-width="1.2"/>
  <text x="505" y="111" text-anchor="middle" fill="#aab3c3" font-size="12">WPF Target</text>
  <text x="505" y="126" text-anchor="middle" fill="#6b7380" font-size="10">any running WPF process</text>

  <!-- HMAC label -->
  <rect x="600" y="100" width="140" height="30" rx="6" fill="#1e1c10" stroke="#6b6030" stroke-width="1"/>
  <text x="670" y="119" text-anchor="middle" fill="#c8b860" font-size="11">HMAC-SHA256 handshake</text>

  <!-- Arrows: AI → Mode boxes -->
  <line x1="160" y1="100" x2="208" y2="50" stroke="#5b7ed8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="160" y1="110" x2="208" y2="122" stroke="#5b7ed8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="160" y1="120" x2="208" y2="185" stroke="#5b7ed8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrows: Mode 2 + 3 → WPF Target -->
  <line x1="370" y1="122" x2="428" y2="112" stroke="#e8c76f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="370" y1="185" x2="428" y2="128" stroke="#b87fcc" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 33 tools label -->
  <text x="380" y="210" text-anchor="middle" fill="#6b7380" font-size="11">33 wpf_* tools — same surface across all 3 modes</text>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#8899bb"/>
    </marker>
  </defs>
</svg>
