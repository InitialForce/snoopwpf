name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  pack-and-publish:
    name: pack-and-publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Release
        run: dotnet build Snoop.sln --configuration Release --no-incremental -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Test Snoop.Core.Tests
        run: dotnet test Snoop.Core.Tests/Snoop.Core.Tests.csproj --configuration Release --framework net8.0-windows --no-build --logger "trx;LogFileName=Snoop.Core.Tests-release.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Tests
        run: dotnet test SnoopWPF.Agent.Tests/SnoopWPF.Agent.Tests.csproj --configuration Release --framework net8.0-windows --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Tests-release.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.InjectionTests
        # TODO(FX5-CI): enable injection tests on self-hosted runner when available
        # RequiresInjection tests need elevated privileges / UI session that GHA windows-latest runners do not provide.
        run: dotnet test SnoopWPF.Agent.InjectionTests/SnoopWPF.Agent.InjectionTests.csproj --configuration Release --framework net8.0-windows --no-build --filter "Category!=RequiresInjection" --logger "trx;LogFileName=SnoopWPF.Agent.InjectionTests-release.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Analyzers.Tests
        run: dotnet test SnoopWPF.Agent.Analyzers.Tests/SnoopWPF.Agent.Analyzers.Tests.csproj --configuration Release --framework net8.0 --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Analyzers.Tests-release.trx" --results-directory output/test-results

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: output/test-results
          retention-days: 7

      - name: Pack SnoopWPF.Agent.Contracts
        run: >
          dotnet pack SnoopWPF.Agent.Contracts/SnoopWPF.Agent.Contracts.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent.Analyzers
        run: >
          dotnet pack SnoopWPF.Agent.Analyzers/SnoopWPF.Agent.Analyzers.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent.Remote
        run: >
          dotnet pack SnoopWPF.Agent.Remote/SnoopWPF.Agent.Remote.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent.BrokerHost
        run: >
          dotnet pack SnoopWPF.Agent.BrokerHost/SnoopWPF.Agent.BrokerHost.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent (Server)
        run: >
          dotnet pack SnoopWPF.Agent.Server/SnoopWPF.Agent.Server.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push artifacts/nupkg/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
