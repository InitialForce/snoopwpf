name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # for gh release create
  packages: write  # publish nupkgs to GitHub Packages (github.com/InitialForce)

jobs:
  pack-and-publish:
    name: pack-and-publish
    runs-on: windows-latest
    timeout-minutes: 30

    # Promote the codesign secret to a job-level env var so step-level `if:`
    # conditions can reference it. The `secrets` context is not allowed inside
    # step-level `if:` expressions (workflow schema rejects it at parse time).
    env:
      HAS_CODESIGN_CERT: ${{ secrets.CODESIGN_PFX_BASE64 != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ensure PowerShell 7.4.x LTS is in use (7.2 hit EOL 2024-11-08).
      # windows-latest ships 7.4.x; this step makes the requirement explicit and
      # fails fast if the runner image regresses to an older version.
      - name: Assert PowerShell 7.4.x
        shell: pwsh
        run: |
          $v = $PSVersionTable.PSVersion
          Write-Host "PowerShell $v"
          if ($v.Major -lt 7 -or ($v.Major -eq 7 -and $v.Minor -lt 4)) {
            throw "PowerShell 7.4.x required (found $v). Update the runner image or add a setup-powershell step."
          }

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # Snoop.Core.Tests multi-targets net472 + net6.0-windows. The .NET 6
          # runtime is no longer preinstalled on windows-latest, so the test
          # host fails with "You must install or update .NET to run this
          # application" if we don't add it here. .NET 8 is needed for the
          # Agent test suites.
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Release
        # Note: --no-incremental is deliberately NOT passed here. It maps to MSBuild
        # /t:Rebuild, which fails on Snoop.GenericInjector.vcxproj (the native C++
        # project does not define a Rebuild target). Since the runner starts from a
        # fresh checkout there is no stale output to worry about.
        run: dotnet build Snoop.sln --configuration Release -p:Version=${{ steps.version.outputs.VERSION }}

      # ---------------------------------------------------------------------------
      # Authenticode codesign for Snoop.GenericInjector.dll
      #
      # This step imports a PFX from the repository secret CODESIGN_PFX_BASE64 and
      # signs all three architecture variants of the native injector DLL.
      # It is skipped silently when the secret is absent so that forks / PRs without
      # a cert still produce a build.
      #
      # One-time setup for repo owners:
      #   1. Obtain an EV code-signing certificate (PFX) from DigiCert / Sectigo etc.
      #   2. base64-encode the PFX:
      #        certutil -encode cert.pfx cert.b64 && type cert.b64
      #   3. Add two repository secrets:
      #        CODESIGN_PFX_BASE64   – base64 content of the PFX
      #        CODESIGN_PFX_PASSWORD – passphrase of the PFX
      # ---------------------------------------------------------------------------
      - name: Import code-signing certificate
        id: import-cert
        if: env.HAS_CODESIGN_CERT == 'true'
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.CODESIGN_PFX_BASE64 }}")
          $pfxPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          Write-Output "PFX_PATH=$pfxPath" >> $env:GITHUB_OUTPUT

      - name: Sign Snoop.GenericInjector.dll (all architectures)
        if: env.HAS_CODESIGN_CERT == 'true'
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits" -Filter signtool.exe -ErrorAction SilentlyContinue |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { $signtool = "signtool.exe" }
          $pfxPath = "${{ steps.import-cert.outputs.PFX_PATH }}"
          $dlls = @(
            "bin\Release\Snoop.GenericInjector.x86.dll",
            "bin\Release\Snoop.GenericInjector.x64.dll",
            "bin\Release\Snoop.GenericInjector.ARM64.dll"
          ) | Where-Object { Test-Path $_ }
          foreach ($dll in $dlls) {
            Write-Host "Signing $dll"
            & "$signtool" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f "$pfxPath" /p "${{ secrets.CODESIGN_PFX_PASSWORD }}" "$dll"
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $dll" }
          }

      - name: Verify Snoop.GenericInjector.dll signatures
        if: env.HAS_CODESIGN_CERT == 'true'
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits" -Filter signtool.exe -ErrorAction SilentlyContinue |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { $signtool = "signtool.exe" }
          $dlls = @(
            "bin\Release\Snoop.GenericInjector.x86.dll",
            "bin\Release\Snoop.GenericInjector.x64.dll",
            "bin\Release\Snoop.GenericInjector.ARM64.dll"
          ) | Where-Object { Test-Path $_ }
          foreach ($dll in $dlls) {
            Write-Host "Verifying $dll"
            & "$signtool" verify /pa "$dll"
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $dll" }
          }

      - name: Clean up PFX
        if: ${{ always() && env.HAS_CODESIGN_CERT == 'true' }}
        shell: pwsh
        run: |
          $pfxPath = "${{ steps.import-cert.outputs.PFX_PATH }}"
          if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }

      - name: Test Snoop.Core.Tests
        run: dotnet test Snoop.Core.Tests/Snoop.Core.Tests.csproj --configuration Release --framework net6.0-windows --no-build --logger "trx;LogFileName=Snoop.Core.Tests-release.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Tests
        run: dotnet test SnoopWPF.Agent.Tests/SnoopWPF.Agent.Tests.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Tests-release.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.InjectionTests
        # TODO(FX5-CI): enable injection tests on self-hosted runner when available
        # RequiresInjection tests need elevated privileges / UI session that GHA windows-latest runners do not provide.
        run: dotnet test SnoopWPF.Agent.InjectionTests/SnoopWPF.Agent.InjectionTests.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --no-build --filter "Category!=RequiresInjection" --logger "trx;LogFileName=SnoopWPF.Agent.InjectionTests-release.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Analyzers.Tests
        run: dotnet test SnoopWPF.Agent.Analyzers.Tests/SnoopWPF.Agent.Analyzers.Tests.csproj --configuration Release --framework net8.0 --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Analyzers.Tests-release.trx" --results-directory output/test-results

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: output/test-results
          retention-days: 7

      - name: Pack SnoopWPF.Agent.Contracts
        run: >
          dotnet pack SnoopWPF.Agent.Contracts/SnoopWPF.Agent.Contracts.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent.Analyzers
        run: >
          dotnet pack SnoopWPF.Agent.Analyzers/SnoopWPF.Agent.Analyzers.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent.Remote
        run: >
          dotnet pack SnoopWPF.Agent.Remote/SnoopWPF.Agent.Remote.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent.BrokerHost
        run: >
          dotnet pack SnoopWPF.Agent.BrokerHost/SnoopWPF.Agent.BrokerHost.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent (Server)
        run: >
          dotnet pack SnoopWPF.Agent.Server/SnoopWPF.Agent.Server.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg

      # ---------------------------------------------------------------------------
      # Publish to GitHub Packages (github.com/orgs/InitialForce/packages)
      #
      # We publish to GitHub Packages (not nuget.org) because nuget.org currently
      # rejects every push under the InitialForce.* prefix with 409 Conflict,
      # regardless of auth method (OIDC Trusted Publishing, personal API key).
      # Likely cause: a reserved-prefix claim not yet tied to our account, which
      # is only resolvable through a nuget.org support ticket.
      #
      # GitHub Packages:
      #   - Feed URL: https://nuget.pkg.github.com/InitialForce/index.json
      #   - Auth: GITHUB_TOKEN with packages:write (granted at workflow level).
      #   - Visibility: inherits from this repo (public once linked).
      #
      # Consumer config: see docs/consuming-nuget.md for nuget.config + PAT.
      # ---------------------------------------------------------------------------
      - name: Publish to GitHub Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $source = "https://nuget.pkg.github.com/InitialForce/index.json"
          # Push nupkgs (snupkgs are picked up automatically when in the same folder).
          Get-ChildItem artifacts/nupkg/*.nupkg | ForEach-Object {
            Write-Host "Pushing $($_.Name) → $source"
            dotnet nuget push $_.FullName `
              --source $source `
              --api-key $env:GH_TOKEN `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($_.Name)" }
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $isPrerelease = if ($tag -match '-(alpha|beta|rc)\.') { '--prerelease' } else { '' }
          gh release create $tag `
            artifacts/nupkg/*.nupkg `
            artifacts/nupkg/*.snupkg `
            --generate-notes `
            $isPrerelease `
            --title "$tag"
