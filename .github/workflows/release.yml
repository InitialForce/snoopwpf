name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  pack-and-publish:
    name: pack-and-publish
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ensure PowerShell 7.4.x LTS is in use (7.2 hit EOL 2024-11-08).
      # windows-latest ships 7.4.x; this step makes the requirement explicit and
      # fails fast if the runner image regresses to an older version.
      - name: Assert PowerShell 7.4.x
        shell: pwsh
        run: |
          $v = $PSVersionTable.PSVersion
          Write-Host "PowerShell $v"
          if ($v.Major -lt 7 -or ($v.Major -eq 7 -and $v.Minor -lt 4)) {
            throw "PowerShell 7.4.x required (found $v). Update the runner image or add a setup-powershell step."
          }

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Release
        run: dotnet build Snoop.sln --configuration Release --no-incremental -p:Version=${{ steps.version.outputs.VERSION }}

      # ---------------------------------------------------------------------------
      # Authenticode codesign for Snoop.GenericInjector.dll
      #
      # This step imports a PFX from the repository secret CODESIGN_PFX_BASE64 and
      # signs all three architecture variants of the native injector DLL.
      # It is skipped silently when the secret is absent so that forks / PRs without
      # a cert still produce a build.
      #
      # One-time setup for repo owners:
      #   1. Obtain an EV code-signing certificate (PFX) from DigiCert / Sectigo etc.
      #   2. base64-encode the PFX:
      #        certutil -encode cert.pfx cert.b64 && type cert.b64
      #   3. Add two repository secrets:
      #        CODESIGN_PFX_BASE64   – base64 content of the PFX
      #        CODESIGN_PFX_PASSWORD – passphrase of the PFX
      # ---------------------------------------------------------------------------
      - name: Import code-signing certificate
        id: import-cert
        if: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.CODESIGN_PFX_BASE64 }}")
          $pfxPath  = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
          Write-Output "PFX_PATH=$pfxPath" >> $env:GITHUB_OUTPUT

      - name: Sign Snoop.GenericInjector.dll (all architectures)
        if: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits" -Filter signtool.exe -ErrorAction SilentlyContinue |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { $signtool = "signtool.exe" }
          $pfxPath = "${{ steps.import-cert.outputs.PFX_PATH }}"
          $dlls = @(
            "bin\Release\Snoop.GenericInjector.x86.dll",
            "bin\Release\Snoop.GenericInjector.x64.dll",
            "bin\Release\Snoop.GenericInjector.ARM64.dll"
          ) | Where-Object { Test-Path $_ }
          foreach ($dll in $dlls) {
            Write-Host "Signing $dll"
            & "$signtool" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /f "$pfxPath" /p "${{ secrets.CODESIGN_PFX_PASSWORD }}" "$dll"
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $dll" }
          }

      - name: Verify Snoop.GenericInjector.dll signatures
        if: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits" -Filter signtool.exe -ErrorAction SilentlyContinue |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { $signtool = "signtool.exe" }
          $dlls = @(
            "bin\Release\Snoop.GenericInjector.x86.dll",
            "bin\Release\Snoop.GenericInjector.x64.dll",
            "bin\Release\Snoop.GenericInjector.ARM64.dll"
          ) | Where-Object { Test-Path $_ }
          foreach ($dll in $dlls) {
            Write-Host "Verifying $dll"
            & "$signtool" verify /pa "$dll"
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $dll" }
          }

      - name: Clean up PFX
        if: ${{ always() && secrets.CODESIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfxPath = "${{ steps.import-cert.outputs.PFX_PATH }}"
          if (Test-Path $pfxPath) { Remove-Item $pfxPath -Force }

      - name: Test Snoop.Core.Tests
        run: dotnet test Snoop.Core.Tests/Snoop.Core.Tests.csproj --configuration Release --framework net8.0-windows --no-build --logger "trx;LogFileName=Snoop.Core.Tests-release.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Tests
        run: dotnet test SnoopWPF.Agent.Tests/SnoopWPF.Agent.Tests.csproj --configuration Release --framework net8.0-windows --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Tests-release.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.InjectionTests
        # TODO(FX5-CI): enable injection tests on self-hosted runner when available
        # RequiresInjection tests need elevated privileges / UI session that GHA windows-latest runners do not provide.
        run: dotnet test SnoopWPF.Agent.InjectionTests/SnoopWPF.Agent.InjectionTests.csproj --configuration Release --framework net8.0-windows --no-build --filter "Category!=RequiresInjection" --logger "trx;LogFileName=SnoopWPF.Agent.InjectionTests-release.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Analyzers.Tests
        run: dotnet test SnoopWPF.Agent.Analyzers.Tests/SnoopWPF.Agent.Analyzers.Tests.csproj --configuration Release --framework net8.0 --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Analyzers.Tests-release.trx" --results-directory output/test-results

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: output/test-results
          retention-days: 7

      - name: Pack SnoopWPF.Agent.Contracts
        run: >
          dotnet pack SnoopWPF.Agent.Contracts/SnoopWPF.Agent.Contracts.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent.Analyzers
        run: >
          dotnet pack SnoopWPF.Agent.Analyzers/SnoopWPF.Agent.Analyzers.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent.Remote
        run: >
          dotnet pack SnoopWPF.Agent.Remote/SnoopWPF.Agent.Remote.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent.BrokerHost
        run: >
          dotnet pack SnoopWPF.Agent.BrokerHost/SnoopWPF.Agent.BrokerHost.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Pack SnoopWPF.Agent (Server)
        run: >
          dotnet pack SnoopWPF.Agent.Server/SnoopWPF.Agent.Server.csproj
          --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output artifacts/nupkg

      - name: Upload nupkg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push artifacts/nupkg/*.nupkg
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
