name: continuous

on:
  push:
    branches:
      - master
      - develop
    tags:
      - v*
  pull_request:
    branches:
      - develop

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v1
      - name: Download .NET install
        shell: pwsh
        run: Invoke-WebRequest 'https://dot.net/v1/dotnet-install.ps1' -OutFile 'dotnet-install.ps1'
      - name: Install .NET 6 SDK
        shell: pwsh
        run: ./dotnet-install.ps1 -Version 6.0.400 -InstallDir "C:\Program Files\dotnet"
      - name: Install .NET 10 SDK
        shell: pwsh
        run: ./dotnet-install.ps1 -Version 10.0.100 -InstallDir "C:\Program Files\dotnet"
      - name: Run './build.cmd CI'
        run: ./build.cmd CI
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: output/test-results
        if: ${{ always() }}
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: agent-nupkg
          path: artifacts/SnoopWPF.Agent.*.nupkg
        if: ${{ always() }}
      - uses: actions/upload-artifact@v4
        with:
          name: snoop-mcp
          path: artifacts/snoop-mcp.*.zip
        if: ${{ always() }}
      - uses: actions/upload-artifact@v4
        with:
          name: snoop-cli
          path: artifacts/snoop-cli.*.zip
        if: ${{ always() }}
