name: continuous

on:
  push:
    branches:
      - master
      - develop
    tags:
      - v*
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'ARCHITECTURE-CHANGE-*.md'
      - 'Changelog.md'
      - 'Artwork/**'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'ARCHITECTURE-CHANGE-*.md'
      - 'Changelog.md'
      - 'Artwork/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run './build.cmd CI'
        run: ./build.cmd CI
      - uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: output/test-results
        if: ${{ always() }}
      - uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: agent-nupkg
          path: artifacts/SnoopWPF.Agent.*.nupkg
        if: ${{ always() }}
      - uses: actions/upload-artifact@v4
        with:
          name: snoop-mcp
          path: artifacts/snoop-mcp.*.zip
        if: ${{ always() }}
      - uses: actions/upload-artifact@v4
        with:
          name: snoop-cli
          path: artifacts/snoop-cli.*.zip
        if: ${{ always() }}
