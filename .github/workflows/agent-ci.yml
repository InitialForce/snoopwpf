name: agent-ci

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'ARCHITECTURE-CHANGE-*.md'
      - 'Changelog.md'
      - 'Artwork/**'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'ARCHITECTURE-CHANGE-*.md'
      - 'Changelog.md'
      - 'Artwork/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  snoop-suite:
    name: snoop-suite (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [net8.0-windows, net6.0-windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion.MsBuild needs full history; a shallow clone fails MSB3073.
          fetch-depth: 0

      # Ensure PowerShell 7.4.x LTS is in use (7.2 hit EOL 2024-11-08).
      - name: Assert PowerShell 7.4.x
        shell: pwsh
        run: |
          $v = $PSVersionTable.PSVersion
          Write-Host "PowerShell $v"
          if ($v.Major -lt 7 -or ($v.Major -eq 7 -and $v.Minor -lt 4)) {
            throw "PowerShell 7.4.x required (found $v). Update the runner image or add a setup-powershell step."
          }

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # CI_Release excludes the native Snoop.GenericInjector.vcxproj (dotnet cannot
      # build C++) and each managed project builds its own declared TFM(s) — so no
      # single --framework can be passed across the heterogeneous solution.
      - name: Build Snoop.sln
        run: dotnet build Snoop.sln --configuration CI_Release --no-incremental

      # Informational: check whether the native injector DLL carries an Authenticode
      # signature.  CI builds are not signed, so this step is allowed to fail.
      # It catches accidental stripping of signatures in signed artifacts.
      - name: Verify Snoop.GenericInjector.dll signature (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits" -Filter signtool.exe -ErrorAction SilentlyContinue |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { $signtool = "signtool.exe" }
          $dlls = @(
            "bin\Release\Snoop.GenericInjector.x86.dll",
            "bin\Release\Snoop.GenericInjector.x64.dll",
            "bin\Release\Snoop.GenericInjector.ARM64.dll"
          ) | Where-Object { Test-Path $_ }
          if ($dlls.Count -eq 0) {
            Write-Host "No GenericInjector DLLs found in bin\Release — skipping signature check."
            exit 0
          }
          $unsigned = @()
          foreach ($dll in $dlls) {
            $result = & "$signtool" verify /pa "$dll" 2>&1
            if ($LASTEXITCODE -ne 0) { $unsigned += $dll }
          }
          if ($unsigned.Count -gt 0) {
            Write-Warning "Unsigned DLLs (expected on CI builds without a cert): $($unsigned -join ', ')"
          } else {
            Write-Host "All GenericInjector DLLs are Authenticode-signed."
          }

      # Snoop.Core.Tests targets net6.0-windows;net472 — it has no net8 build, so it
      # only runs on the net6.0-windows matrix leg.
      - name: Test Snoop.Core.Tests
        if: matrix.target == 'net6.0-windows'
        run: dotnet test Snoop.Core.Tests/Snoop.Core.Tests.csproj --configuration Release --framework net6.0-windows --no-build --logger "trx;LogFileName=Snoop.Core.Tests-${{ matrix.target }}.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Tests
        if: matrix.target == 'net8.0-windows'
        run: dotnet test SnoopWPF.Agent.Tests/SnoopWPF.Agent.Tests.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Tests-${{ matrix.target }}.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.InjectionTests
        if: matrix.target == 'net8.0-windows'
        run: dotnet test SnoopWPF.Agent.InjectionTests/SnoopWPF.Agent.InjectionTests.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --no-build --filter "Category!=RequiresInjection" --logger "trx;LogFileName=SnoopWPF.Agent.InjectionTests-${{ matrix.target }}.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Analyzers.Tests
        if: matrix.target == 'net8.0-windows'
        run: dotnet test SnoopWPF.Agent.Analyzers.Tests/SnoopWPF.Agent.Analyzers.Tests.csproj --configuration Release --framework net8.0 --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Analyzers.Tests-${{ matrix.target }}.trx" --results-directory output/test-results

      # RequiresWpf integration tests depend on a real rendered desktop (virtualized
      # scroll-materialisation, laid-out Width, etc.) and are flaky on the CI runner —
      # excluded here, run locally. The deterministic broker/security/fetch-blob tests
      # still gate CI. MANUAL_VERIFICATION covers the [Ignore]'d live-injection cases.
      - name: Test SnoopWPF.Agent.IntegrationTests
        if: matrix.target == 'net8.0-windows'
        run: dotnet test SnoopWPF.Agent.IntegrationTests/SnoopWPF.Agent.IntegrationTests.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --no-build --filter "Category!=RequiresWpf&Category!=MANUAL_VERIFICATION" --logger "trx;LogFileName=SnoopWPF.Agent.IntegrationTests-${{ matrix.target }}.trx" --results-directory output/test-results

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target }}
          path: output/test-results
          retention-days: 7

  brokered-suite:
    name: brokered-suite (net8.0-windows / x64)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [net8.0-windows]
        arch: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion.MsBuild needs full history; a shallow clone fails MSB3073.
          fetch-depth: 0

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # CI_Release excludes the native vcxproj; -p:Platform exercises the x64 path.
      - name: Build Snoop.sln
        run: dotnet build Snoop.sln --configuration CI_Release --no-incremental -p:Platform=${{ matrix.arch }}

      # The end-to-end Brokered* round-trip tests are RequiresWpf (need a live desktop)
      # and run locally. Under x64 we still gate the deterministic broker tests —
      # spawn-security, reconnect, broker-host — to catch x64-specific regressions.
      - name: Test SnoopWPF.Agent.IntegrationTests (broker, x64)
        run: dotnet test SnoopWPF.Agent.IntegrationTests/SnoopWPF.Agent.IntegrationTests.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --no-build --filter "FullyQualifiedName~Broker&Category!=RequiresWpf&Category!=MANUAL_VERIFICATION" --logger "trx;LogFileName=brokered-suite-${{ matrix.target }}-${{ matrix.arch }}.trx" --results-directory output/test-results

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brokered-suite-logs-${{ matrix.target }}-${{ matrix.arch }}
          path: output/test-results
          retention-days: 7

  verigui-harness:
    name: verigui-harness (net8.0-windows)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: snoop-suite

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GitVersion.MsBuild needs full history; a shallow clone fails MSB3073.
          fetch-depth: 0

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build VeriGuiHarness
        run: dotnet build SnoopWPF.Agent.VeriGuiHarness/SnoopWPF.Agent.VeriGuiHarness.csproj --configuration Release --framework net8.0-windows10.0.19041.0 --no-incremental

      - name: Run VeriGUI harness (assert thresholds)
        run: >
          dotnet run --project SnoopWPF.Agent.VeriGuiHarness/SnoopWPF.Agent.VeriGuiHarness.csproj
          --configuration Release --framework net8.0-windows10.0.19041.0 --no-build --
          --run
          --scenarios "${{ github.workspace }}/SnoopWPF.Agent.VeriGuiHarness/Scenarios"
          --out output/verigui-report.json
          --assert-pass-thresholds

      - name: Upload VeriGUI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verigui-report
          path: output/verigui-report.json
          retention-days: 7
