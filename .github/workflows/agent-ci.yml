name: agent-ci

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'ARCHITECTURE-CHANGE-*.md'
      - 'Changelog.md'
      - 'Artwork/**'
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'ARCHITECTURE-CHANGE-*.md'
      - 'Changelog.md'
      - 'Artwork/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  snoop-suite:
    name: snoop-suite (${{ matrix.target }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [net8.0-windows, net6.0-windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Snoop.sln
        run: dotnet build Snoop.sln --configuration Release --framework ${{ matrix.target }} --no-incremental

      # Informational: check whether the native injector DLL carries an Authenticode
      # signature.  CI builds are not signed, so this step is allowed to fail.
      # It catches accidental stripping of signatures in signed artifacts.
      - name: Verify Snoop.GenericInjector.dll signature (informational)
        continue-on-error: true
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits" -Filter signtool.exe -ErrorAction SilentlyContinue |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { $signtool = "signtool.exe" }
          $dlls = @(
            "bin\Release\Snoop.GenericInjector.x86.dll",
            "bin\Release\Snoop.GenericInjector.x64.dll",
            "bin\Release\Snoop.GenericInjector.ARM64.dll"
          ) | Where-Object { Test-Path $_ }
          if ($dlls.Count -eq 0) {
            Write-Host "No GenericInjector DLLs found in bin\Release — skipping signature check."
            exit 0
          }
          $unsigned = @()
          foreach ($dll in $dlls) {
            $result = & "$signtool" verify /pa "$dll" 2>&1
            if ($LASTEXITCODE -ne 0) { $unsigned += $dll }
          }
          if ($unsigned.Count -gt 0) {
            Write-Warning "Unsigned DLLs (expected on CI builds without a cert): $($unsigned -join ', ')"
          } else {
            Write-Host "All GenericInjector DLLs are Authenticode-signed."
          }

      - name: Test Snoop.Core.Tests
        run: dotnet test Snoop.Core.Tests/Snoop.Core.Tests.csproj --configuration Release --framework ${{ matrix.target }} --no-build --logger "trx;LogFileName=Snoop.Core.Tests-${{ matrix.target }}.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Tests
        if: matrix.target == 'net8.0-windows'
        run: dotnet test SnoopWPF.Agent.Tests/SnoopWPF.Agent.Tests.csproj --configuration Release --framework net8.0-windows --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Tests-${{ matrix.target }}.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.InjectionTests
        if: matrix.target == 'net8.0-windows'
        run: dotnet test SnoopWPF.Agent.InjectionTests/SnoopWPF.Agent.InjectionTests.csproj --configuration Release --framework net8.0-windows --no-build --filter "Category!=RequiresInjection" --logger "trx;LogFileName=SnoopWPF.Agent.InjectionTests-${{ matrix.target }}.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.Analyzers.Tests
        if: matrix.target == 'net8.0-windows'
        run: dotnet test SnoopWPF.Agent.Analyzers.Tests/SnoopWPF.Agent.Analyzers.Tests.csproj --configuration Release --framework net8.0 --no-build --logger "trx;LogFileName=SnoopWPF.Agent.Analyzers.Tests-${{ matrix.target }}.trx" --results-directory output/test-results

      - name: Test SnoopWPF.Agent.IntegrationTests
        if: matrix.target == 'net8.0-windows'
        run: dotnet test SnoopWPF.Agent.IntegrationTests/SnoopWPF.Agent.IntegrationTests.csproj --configuration Release --framework net8.0-windows --no-build --logger "trx;LogFileName=SnoopWPF.Agent.IntegrationTests-${{ matrix.target }}.trx" --results-directory output/test-results

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.target }}
          path: output/test-results
          retention-days: 7

  brokered-suite:
    name: brokered-suite (net8.0-windows / x64)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [net8.0-windows]
        arch: [x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build Snoop.sln
        run: dotnet build Snoop.sln --configuration Release --framework ${{ matrix.target }} --no-incremental -p:Platform=${{ matrix.arch }}

      - name: Test SnoopWPF.Agent.IntegrationTests (Brokered filter)
        run: dotnet test SnoopWPF.Agent.IntegrationTests/SnoopWPF.Agent.IntegrationTests.csproj --configuration Release --framework ${{ matrix.target }} --no-build --filter "FullyQualifiedName~Brokered" --logger "trx;LogFileName=brokered-suite-${{ matrix.target }}-${{ matrix.arch }}.trx" --results-directory output/test-results

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brokered-suite-logs-${{ matrix.target }}-${{ matrix.arch }}
          path: output/test-results
          retention-days: 7

  verigui-harness:
    name: verigui-harness (net8.0-windows)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: snoop-suite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build VeriGuiHarness
        run: dotnet build SnoopWPF.Agent.VeriGuiHarness/SnoopWPF.Agent.VeriGuiHarness.csproj --configuration Release --framework net8.0-windows --no-incremental

      - name: Run VeriGUI harness (assert thresholds)
        run: >
          dotnet run --project SnoopWPF.Agent.VeriGuiHarness/SnoopWPF.Agent.VeriGuiHarness.csproj
          --configuration Release --framework net8.0-windows --no-build --
          --run
          --scenarios "${{ github.workspace }}/SnoopWPF.Agent.VeriGuiHarness/Scenarios"
          --out output/verigui-report.json
          --assert-pass-thresholds

      - name: Upload VeriGUI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verigui-report
          path: output/verigui-report.json
          retention-days: 7
